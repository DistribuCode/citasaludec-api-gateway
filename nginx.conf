events {
    worker_connections 1024;
}

http {
    upstream auth-service { server auth-service:3001; }
    upstream user-service { server user-service:4000; }
    upstream user-registration { server user-registration:4001; }
    upstream appointment-service { server appointment-service:4007; }
    upstream cancel-appointment-service { server cancel-appointment-service:4008; }
    upstream availability-service { server availability-service:4010; }
    # upstream send-sms-service { server send-sms:5000; } ❌ Servicio no disponible
    # upstream email-service { server email-service:4003; }
    # upstream push-notifications-service { server push-notifications:8080; } ❌ Contenedor no está activo
    upstream logs-service { server logs-service:4011; }

    server {
        listen 80;

        location /auth/ {
            proxy_pass http://auth-service:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /user/ {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /registration/ {
            proxy_pass http://user-registration;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /appointments/ {
            proxy_pass http://appointment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /cancel/ {
            proxy_pass http://cancel-appointment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /availability/ {
            proxy_pass http://availability-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # location /sms/ {
        #     proxy_pass http://send-sms-service;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # location /email/ {
        #    proxy_pass http://email-service;
        #   proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # location /push/ {
        #     proxy_pass http://push-notifications-service;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        location /logs/ {
            proxy_pass http://logs-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
